subtask_series: [enh, asr]

model_conf:
  calc_enh_loss: false
  enh_frontend_no_grad: true
  bypass_enh_prob: 0.0

enh_model_conf:
  loss_type: si_snr

enh_encoder: conv
enh_encoder_conf:
  channel: 384
  kernel_size: 40
  stride: 20
enh_decoder: conv
enh_decoder_conf:
  channel: 384
  kernel_size: 40
  stride: 20
enh_separator: tcn
enh_separator_conf:
  num_spk: 1
  layer: 6
  stack: 3
  bottleneck_dim: 384
  hidden_dim: 768
  kernel: 3
  causal: false
  norm_type: gLN
  nonlinear: relu

enh_criterions:
  - name: si_snr
    conf:
      eps: 1.0e-7
    wrapper: fixed_order
    wrapper_conf:
      weight: 1.0

frontend: default

specaug: null

normalize: utterance_mvn
normalize_conf: {}

asr_preencoder: null
asr_preencoder_conf: {}

asr_encoder: conformer
asr_encoder_conf:
  output_size: 256
  attention_heads: 4
  linear_units: 1024
  num_blocks: 6
  dropout_rate: 0.1
  positional_dropout_rate: 0.2
  attention_dropout_rate: 0.1
  input_layer: conv2d
  normalize_before: true
  macaron_style: true
  rel_pos_type: latest
  pos_enc_layer_type: rel_pos
  selfattention_layer_type: rel_selfattn
  activation_type: swish
  use_cnn_module: true
  cnn_module_kernel: 31

asr_postencoder: null
asr_postencoder_conf: {}

asr_decoder: transducer
asr_decoder_conf:
  rnn_type: lstm
  num_layers: 1
  hidden_size: 256
  dropout: 0.1
  dropout_embed: 0.2

joint_net_conf:
  joint_space_size: 256

asr_model_conf:
  transducer_weight: 1.0
  use_k2_pruned_loss: true
  k2_pruned_loss_args:
    prune_range: 5
    simple_loss_scaling: 0.5
    lm_scale: 0.0
    am_scale: 0.0
    loss_type: regular
    reduction: mean
  ctc_weight: 0.0
  interctc_weight: 0.0
  lsm_weight: 0.0
  length_normalized_loss: false
  report_cer: true
  report_wer: true

optim: adam
optim_conf:
  lr: 0.0002
  weight_decay: 0.000001

scheduler: warmuplr
scheduler_conf:
  warmup_steps: 5000

init: none
max_epoch: 200
patience: none
num_att_plot: 0
unused_parameters: true

batch_type: numel
batch_bins: 24000000
accum_grad: 4
num_workers: 4

val_scheduler_criterion:
  - valid
  - loss
best_model_criterion:
  - - valid
    - loss
    - min
keep_nbest_models: 10

seed: 2022
use_amp: false
