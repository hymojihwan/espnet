model_conf:
  use_asr_ot_frontend: true
  se_train_config: exp/enh_train_enh_convtasnet_small_librispeech_raw/config.yaml
  se_model_file: exp/enh_train_enh_convtasnet_small_librispeech_raw/valid.loss.best.pth
  asr_train_config: exp/asr_asr_conformer-rnnt-nonk2-nosp-nospec_main/config.yaml
  asr_model_file: exp/asr_asr_conformer-rnnt-nonk2-nosp-nospec_main/valid.loss.ave_10best.pth
  ot_weight: 1.0
  l1_weight: 1.0
  mask_l1_weight: 0.0001
  ot_epsilon: 0.05
  ot_num_iters: 15
  correction_hidden_dim: 512

# Unused by OT frontend path, but required by EnhancementTask builder.
encoder: conv
encoder_conf:
  channel: 8
  kernel_size: 16
  stride: 8

separator: rnn
separator_conf:
  num_spk: 1
  layer: 1
  unit: 16
  dropout: 0.0
  nonlinear: relu

decoder: conv
decoder_conf:
  channel: 8
  kernel_size: 16
  stride: 8

criterions:
  - name: si_snr
    conf:
      eps: 1.0e-7
    wrapper: fixed_order
    wrapper_conf:
      weight: 1.0

optim: adam
optim_conf:
  lr: 0.0005
  weight_decay: 0.0

scheduler: warmuplr
scheduler_conf:
  warmup_steps: 2000

init: none
max_epoch: 30
patience: none
num_att_plot: 0

batch_type: numel
batch_bins: 1600000
accum_grad: 1
num_workers: 8

best_model_criterion:
  - - valid
    - loss
    - min
keep_nbest_models: 5
seed: 2022
use_amp: false
