# Conformer CTC for CHiME4 — tuned to avoid CTC collapse (THE/S/.PERIOD repeat)
batch_type: numel
batch_bins: 24000000
accum_grad: 16
max_epoch: 200
patience: 20
early_stopping_criterion: [valid, cer_ctc, min]
init: none
best_model_criterion:
-   - valid
    - cer_ctc
    - min
keep_nbest_models: 10

encoder: conformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 12
    # Fewer layers first so model can learn; increase to 18 after it converges
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31

model_conf:
    ctc_weight: 1.0
    lsm_weight: 0.0
    length_normalized_loss: true

optim: adam
optim_conf:
    lr: 0.0005
    weight_decay: 0.0001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 25000

num_att_plot: 0

# No SpecAugment — CHiME4 is already noisy
specaug: null
