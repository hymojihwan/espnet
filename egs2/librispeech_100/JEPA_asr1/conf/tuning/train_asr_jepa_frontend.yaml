# JEPA (Joint Embedding Predictive Architecture) Frontend for ASR
# This configuration uses JEPA-based frontend for noise reduction without speech enhancement

# general
batch_type: numel
batch_bins: 8000000
accum_grad: 9
max_epoch: 100
patience: none
init: none
num_att_plot: 0

model_conf:
    use_k2_pruned_loss: false
    transducer_weight: 1.0
    auxiliary_ctc_weight: 0.0
    report_cer: True
    report_wer: True

# JEPA Frontend configuration
# Note: The JEPA frontend will be implemented as a custom frontend
# that performs joint embedding and predictive noise reduction
frontend: jepa
frontend_conf:
    # JEPA architecture parameters
    embedding_dim: 512
    predictor_dim: 256
    num_predictor_layers: 2
    dropout_rate: 0.1
    # Audio processing parameters
    n_fft: 512
    hop_length: 256
    win_length: 512
    fs: 16000
    # Noise reduction parameters
    noise_reduction_weight: 1.0
    embedding_loss_weight: 0.5
    # EMA for target encoder (standard JEPA: 0.999)
    ema_decay: 0.999
    # Mask ratio for predictive coding (standard JEPA: 0.3)
    mask_ratio: 0.3

# Pre-encoder to process JEPA frontend output
preencoder: linear
preencoder_conf:
    input_size: 512  # Should match frontend embedding_dim
    output_size: 80  # Standard feature dimension

encoder_conf:
    main_conf:
      pos_wise_act_type: swish
      conv_mod_act_type: swish
      pos_enc_dropout_rate: 0.2
      dynamic_chunk_training: False
      short_chunk_threshold: 0.75
      short_chunk_size: 25
      num_left_chunks: 4
    input_conf:
      vgg_like: True
    body_conf:
    - block_type: conformer
      linear_size: 2048
      hidden_size: 512
      heads: 8
      dropout_rate: 0.1
      pos_wise_dropout_rate: 0.1
      att_dropout_rate: 0.1
      conv_mod_kernel_size: 31
      num_blocks: 12

decoder: rnn
decoder_conf:
    rnn_type: lstm
    num_layers: 1
    embed_size: 512
    hidden_size: 512
    dropout_rate: 0.1
    embed_dropout_rate: 0.2

joint_network_conf:
    joint_space_size: 512

# optimizer
optim: adam
optim_conf:
    lr: 0.001
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 15000

# criterion
val_scheduler_criterion:
    - valid
    - loss
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 10

# specaug is disabled because JEPA frontend already learns noise-robust representations
# specaug: null

# Normalization
normalize: utterance_mvn
normalize_conf: {}
