# Phase 1: train latent BRIDGE and Conformer-CTC jointly from scratch.
# The frozen SE frontend produces enhanced log-Mel features.  After utterance
# MVN and Conv2d subsampling, latent BRIDGE predicts masked EMA target latents.
# Total objective: CTC + 0.08 * latent prediction loss.
batch_type: numel
batch_bins: 9600000
valid_batch_bins: 9600000
accum_grad: 16
max_epoch: 200
patience: none
init: none
num_att_plot: 0
log_interval: null
unused_parameters: false
save_strategy: all

# Deliberately no pretrained initialization: Phase 1 starts from scratch.
freeze_param:
    - frontend

model: jepa_espnet
model_conf:
    ctc_weight: 1.0
    lsm_weight: 0.1
    length_normalized_loss: false
    latent_bridge_conf:
        context_layers: 1
        context_heads: 4
        context_ff_dim: 512
        predictor_layers: 1
        predictor_heads: 4
        predictor_ff_dim: 512
        dropout_rate: 0.1
        mask_ratio: 0.15
        mask_span: 3
        ema_decay: 0.999
        loss_type: cosine
        loss_weight: 0.08

frontend: frozen_enh
frontend_conf:
    enh_train_config: exp/enh_train_enh_convtasnet_small_librispeech960_raw/config.yaml
    enh_model_file: exp/enh_train_enh_convtasnet_small_librispeech960_raw/valid.loss.best.pth
    enh_no_grad: true
    fs: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80

normalize: utterance_mvn
normalize_conf: {}

encoder: conformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31

decoder: null

optim: adam
optim_conf:
    lr: 0.0002
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 5000

specaug: null
use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false

best_model_criterion:
    - [valid, cer_ctc, min]
keep_nbest_models: 10
