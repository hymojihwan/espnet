subtask_series: [enh, asr]

model_conf:
  calc_enh_loss: false
  enh_frontend_no_grad: true
  bypass_enh_prob: 0.0

enh_model_conf:
  loss_type: si_snr

enh_encoder: conv
enh_encoder_conf:
  channel: 256
  kernel_size: 40
  stride: 20
enh_decoder: conv
enh_decoder_conf:
  channel: 256
  kernel_size: 40
  stride: 20
enh_separator: tcn
enh_separator_conf:
  num_spk: 1
  layer: 4
  stack: 2
  bottleneck_dim: 256
  hidden_dim: 512
  kernel: 3
  causal: false
  norm_type: gLN
  nonlinear: relu

enh_criterions:
  - name: si_snr
    conf:
      eps: 1.0e-7
    wrapper: fixed_order
    wrapper_conf:
      weight: 1.0

frontend: default

specaug: specaug
specaug_conf:
  apply_time_warp: true
  time_warp_window: 5
  time_warp_mode: bicubic
  apply_freq_mask: true
  freq_mask_width_range:
    - 0
    - 27
  num_freq_mask: 2
  apply_time_mask: true
  time_mask_width_ratio_range:
    - 0.0
    - 0.05
  num_time_mask: 10

normalize: utterance_mvn
normalize_conf: {}

asr_preencoder: null
asr_preencoder_conf: {}

asr_encoder: conformer
asr_encoder_conf:
  output_size: 512
  attention_heads: 8
  linear_units: 2048
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.2
  attention_dropout_rate: 0.1
  input_layer: conv2d
  normalize_before: true
  macaron_style: true
  rel_pos_type: latest
  pos_enc_layer_type: rel_pos
  selfattention_layer_type: rel_selfattn
  activation_type: swish
  use_cnn_module: true
  cnn_module_kernel: 31

asr_postencoder: null
asr_postencoder_conf: {}

asr_decoder: transducer
asr_decoder_conf:
  rnn_type: lstm
  num_layers: 1
  hidden_size: 512
  dropout: 0.1
  dropout_embed: 0.2

joint_net_conf:
  joint_space_size: 512

asr_model_conf:
  transducer_weight: 1.0
  use_k2_pruned_loss: false
  ctc_weight: 0.0
  interctc_weight: 0.0
  lsm_weight: 0.0
  length_normalized_loss: false
  report_cer: true
  report_wer: true

optim: adam
optim_conf:
  lr: 0.001
  weight_decay: 0.000001

scheduler: warmuplr
scheduler_conf:
  warmup_steps: 15000

init: none
max_epoch: 100
patience: none
num_att_plot: 0

batch_type: numel
batch_bins: 4800000
accum_grad: 16
num_workers: 4

val_scheduler_criterion:
  - valid
  - loss
best_model_criterion:
  - - valid
    - loss
    - min
keep_nbest_models: 10

seed: 2022
use_amp: false
