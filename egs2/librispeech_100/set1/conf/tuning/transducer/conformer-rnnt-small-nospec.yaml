# general
batch_type: numel
batch_bins: 24000000
accum_grad: 4
max_epoch: 200 # 100 produces better results.
patience: none
init: none
num_att_plot: 0

unused_parameters: true    # set as true if some params are unused in DDP

model_conf:
    transducer_weight: 1.0
    auxiliary_ctc_weight: 0.0
    report_cer: True
    report_wer: True
    use_k2_pruned_loss: True
    k2_pruned_loss_args:
      prune_range: 5
      simple_loss_scaling: 0.5
      lm_scale: 0.0
      am_scale: 0.0
      loss_type: regular
      reduction: mean

encoder_conf:
    main_conf:
      pos_wise_act_type: swish
      conv_mod_act_type: swish
      pos_enc_dropout_rate: 0.2
      dynamic_chunk_training: False
      short_chunk_threshold: 0.75
      short_chunk_size: 25
      num_left_chunks: 4
    input_conf:
      vgg_like: True
    body_conf:
    - block_type: conformer
      linear_size: 1024
      hidden_size: 384
      heads: 4
      dropout_rate: 0.1
      pos_wise_dropout_rate: 0.1
      att_dropout_rate: 0.1
      conv_mod_kernel_size: 31
      num_blocks: 6

decoder: rnn
decoder_conf:
    rnn_type: lstm
    num_layers: 1
    embed_size: 384
    hidden_size: 384
    dropout_rate: 0.1
    embed_dropout_rate: 0.2

joint_network_conf:
    joint_space_size: 384

# optimizer
optim: adam
optim_conf:
    lr: 0.001
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 15000

# criterion
val_scheduler_criterion:
    - valid
    - loss
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 10 # 20 produces slightly better results.

# specaug conf
specaug: null
