# Match CTC noisy-100h baseline as closely as possible for RNNT
batch_type: numel
batch_bins: 12000000
accum_grad: 12
max_epoch: 200
patience: none
init: none
num_att_plot: 0
log_interval: null
unused_parameters: false

model_conf:
    transducer_weight: 1.0
    auxiliary_ctc_weight: 0.0
    report_cer: true
    report_wer: true
    use_k2_pruned_loss: true

encoder_conf:
    main_conf:
      pos_wise_act_type: swish
      conv_mod_act_type: swish
      pos_enc_dropout_rate: 0.1
      dynamic_chunk_training: false
      short_chunk_threshold: 0.75
      short_chunk_size: 25
      num_left_chunks: 4
    input_conf:
      vgg_like: true
    body_conf:
    - block_type: conformer
      linear_size: 1024
      hidden_size: 384
      heads: 4
      dropout_rate: 0.1
      pos_wise_dropout_rate: 0.1
      att_dropout_rate: 0.1
      conv_mod_kernel_size: 31
      num_blocks: 12

decoder: rnn
decoder_conf:
    rnn_type: lstm
    num_layers: 1
    embed_size: 384
    hidden_size: 384
    dropout_rate: 0.1
    embed_dropout_rate: 0.1

joint_network_conf:
    joint_space_size: 384

optim: adam
optim_conf:
    lr: 0.0002
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 5000

specaug: null
use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false

val_scheduler_criterion:
    - valid
    - loss
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 10
