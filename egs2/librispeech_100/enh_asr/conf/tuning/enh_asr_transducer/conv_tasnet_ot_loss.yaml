# Enhancement + ASR Transducer training with OT-based Enhancement Loss
# SE is trained with feature-level OT loss instead of waveform-level si-snr loss

# Training configuration
max_epoch: 50
log_interval: 100

# Data configuration
batch_type: numel
batch_bins: 2200000
accum_grad: 16
grad_clip: 5.0
log_interval: 100

# Optimization
optim: adam
optim_conf:
  lr: 0.0003  # Fine-tuning learning rate
  weight_decay: 0.00001

scheduler: warmuplr
scheduler_conf:
  warmup_steps: 5000

val_scheduler_criterion:
  - valid
  - loss

best_model_criterion:
  -   - valid
      - loss
      - min

keep_nbest_models: 10

# Model configuration using baseline ConvTasNet + OT-based Enhancement Loss
model_conf:
  # Enable OT-based enhancement loss model
  use_ot_loss: true
  
  # Loss weights (OT enhancement loss와 ASR 균형)
  ot_enh_weight: 0.2  # Feature-level OT loss for SE
  transducer_weight: 1.0
  
  # Training configuration
  freeze_asr: False
  auxiliary_ctc_weight: 0.0
  report_cer: True
  report_wer: True
  
  # OT parameters for enhancement loss
  epsilon: 0.1  # Entropic regularization for Sinkhorn algorithm
  max_iter: 5  # Maximum iterations for Sinkhorn algorithm

# Enhancement configuration (baseline ConvTasNet)
enh_encoder: same  # Use raw waveform directly
enh_encoder_conf: {}

enh_separator: conv_tasnet_baseline
enh_separator_conf:
  num_filters: 256
  filter_length: 16
  bottleneck_channels: 64
  hidden_channels: 256
  kernel_size: 3
  num_blocks_per_repeat: 8
  num_repeats: 2
  num_speakers: 1

enh_decoder: same  # Use raw waveform directly
enh_decoder_conf: {}

# Note: No enh_criterion since we use OT loss for enhancement
# The model computes OT loss between enhanced and clean features directly

# Frontend configuration for feature extraction
frontend: default
frontend_conf:
  n_mels: 80
  n_fft: 512
  hop_length: 160
  win_length: 400
  fmin: 0
  fmax: null

# SpecAug disabled for enhancement + ASR
normalize: utterance_mvn
normalize_conf: {}

# ASR Encoder configuration (Conformer)
encoder_conf:
  main_conf:
    pos_wise_act_type: swish
    conv_mod_act_type: swish
    pos_enc_dropout_rate: 0.2
    dynamic_chunk_training: False
    short_chunk_threshold: 0.75
    short_chunk_size: 25
    num_left_chunks: 4
  input_conf:
    vgg_like: True
  body_conf:
  - block_type: conformer
    linear_size: 2048
    hidden_size: 512
    heads: 8
    dropout_rate: 0.1
    pos_wise_dropout_rate: 0.1
    att_dropout_rate: 0.1
    conv_mod_kernel_size: 31
    num_blocks: 12

# ASR Decoder configuration (Prediction Network)
decoder: rnn
decoder_conf:
  rnn_type: lstm
  num_layers: 1
  embed_size: 512
  hidden_size: 512
  dropout_rate: 0.1
  embed_dropout_rate: 0.2

# Joint Network configuration
joint_network_conf:
  joint_space_size: 512

# Token configuration
token_type: bpe
bpemodel: data/en_token_list/bpe_unigram2048/bpe.model

