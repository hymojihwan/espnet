# Frozen SE960 + Transformer(S) P-base reconstruction auxiliary + Conformer CTC.
# Both training and inference feed the unmodified enhanced base Mel to ASR.
batch_type: numel
batch_bins: 19200000
accum_grad: 8
max_epoch: 200
patience: none
init: none
num_att_plot: 0
log_interval: null
unused_parameters: false

model: se_jepa_espnet
model_conf:
    ctc_weight: 1.0
    lsm_weight: 0.1
    length_normalized_loss: false
    se_loss_weight: 0.0
    encoder_distill_weight: 0.0

frontend: se_jepa
frontend_conf:
    se_train_config: exp/enh_train_enh_convtasnet_small_librispeech960_raw/config.yaml
    se_model_file: exp/enh_train_enh_convtasnet_small_librispeech960_raw/valid.loss.best.pth
    se_no_grad: true
    use_asteroid_convtasnet: false
    jepa_frontend_conf:
        output_dim: 80
        embedding_dim: 112
        context_encoder_dim: 112
        target_encoder_dim: 112
        predictor_dim: 112
        decoder_dim: 112
        num_context_encoder_layers: 2
        num_target_encoder_layers: 2
        num_predictor_layers: 2
        num_decoder_layers: 2
        patch_size: [10, 80]
        mask_ratio: 0.15
        dropout_rate: 0.1
        encoder_type: transformer
        encoder_conf:
            num_layers: 1
            num_heads: 4
            ff_dim: 224
            dropout_rate: 0.1
            attn_dropout_rate: 0.1
            use_positional_encoding: true
        predictor_type: transformer
        predictor_conf:
            num_layers: 1
            num_heads: 4
            ff_dim: 224
            dropout_rate: 0.1
            attn_dropout_rate: 0.1
            use_positional_encoding: true
        decoder_type: mlp
        asr_input_mode: base
        n_fft: 512
        win_length: 400
        hop_length: 160
        fs: 16000
        n_mels: 80
        embedding_loss_weight: 0.08
        enable_jepa_loss: true
        latent_loss_type: mel_reconstruction
        mel_reconstruction_target: base
        ema_decay: 0.999

encoder: conformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31

decoder: null

optim: adam
optim_conf:
    lr: 0.0002
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 5000

specaug: null
use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false

best_model_criterion:
-   - valid
    - cer_ctc
    - min
keep_nbest_models: 10
