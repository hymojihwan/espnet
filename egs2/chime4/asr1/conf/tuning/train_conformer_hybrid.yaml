encoder: conformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  linear_units: 1024
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: conv2d
  normalize_before: true
  macaron_style: true
  rel_pos_type: latest
  pos_enc_layer_type: rel_pos
  selfattention_layer_type: rel_selfattn
  activation_type: swish
  use_cnn_module: true
  cnn_module_kernel: 31

decoder: transformer
decoder_conf:
  attention_heads: 4
  linear_units: 2048
  num_blocks: 6
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  self_attention_dropout_rate: 0.1
  src_attention_dropout_rate: 0.1

model_conf:
  ctc_weight: 0.3
  lsm_weight: 0.1
  length_normalized_loss: false

frontend: default
specaug: null
specaug_conf: {}
normalize: utterance_mvn
normalize_conf: {}

seed: 2022
use_amp: true
num_workers: 4
batch_type: numel
batch_bins: 24000000
accum_grad: 16
max_epoch: 200
init: none
patience: 20
early_stopping_criterion: [valid, acc, max]
best_model_criterion:
  - - valid
    - acc
    - max
  - - valid
    - loss
    - min
keep_nbest_models: 10

optim: adam
optim_conf:
  lr: 0.0005
  eps: 1.0e-08
  weight_decay: 0.0001
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 3000

num_att_plot: 0
