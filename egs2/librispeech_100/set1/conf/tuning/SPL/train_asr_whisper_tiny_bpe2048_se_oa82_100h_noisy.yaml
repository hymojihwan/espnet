# Whisper-tiny BPE-2048 ASR with frozen SE and observation addition.
normalize: null

frontend: frozen_enh
frontend_conf:
    enh_train_config: exp/enh_train_enh_convtasnet_small_librispeech_raw/config.yaml
    enh_model_file: exp/enh_train_enh_convtasnet_small_librispeech_raw/valid.loss.best.pth
    fs: 16k
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80
    enh_no_grad: true
    observation_addition: true
    enhanced_weight: 0.8
    noisy_weight: 0.2
    output_waveform: true

encoder: whisper
encoder_conf:
    whisper_model: tiny
    dropout_rate: 0.0
    use_specaug: false

decoder: whisper
decoder_conf:
    whisper_model: tiny
    dropout_rate: 0.0

model_conf:
    ctc_weight: 0.0
    lsm_weight: 0.1
    length_normalized_loss: false

seed: 2022
log_interval: null
num_att_plot: 0
num_workers: 4
sort_in_batch: descending
sort_batch: descending
batch_type: numel
batch_bins: 19200000
accum_grad: 8
max_epoch: 200
patience: none
init: none
best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 10

use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false

optim: adamw
grad_clip: 1.0
optim_conf:
    lr: 1.0e-05
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.99
    eps: 1.0e-06
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 1500
