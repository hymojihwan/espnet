# general
batch_type: numel
batch_bins: 4400000
accum_grad: 16
max_epoch: 100
patience: none
init: none
num_att_plot: 0

unused_parameters: true

frontend: jepa_mel_latent
frontend_conf:
    output_dim: 256
    embedding_dim: 256
    predictor_dim: 512
    num_predictor_layers: 2
    dropout_rate: 0.1
    mask_ratio: 0.3
    ema_decay: 0.999
    embedding_loss_weight: 1.0
    loss_type: cosine
    min_mask_frames: 5
    fs: 16000
    n_fft: 512
    hop_length: 160
    win_length: 400
    n_mels: 80

model: jepa_espnet
model_conf:
    transducer_weight: 1.0
    auxiliary_ctc_weight: 0.3
    report_cer: true
    report_wer: true
    ctc_weight_start: 0.05
    ctc_weight_end: 1.0
    ctc_weight_warmup_steps: 15000

encoder_conf:
    main_conf:
      pos_wise_act_type: swish
      conv_mod_act_type: swish
      pos_enc_dropout_rate: 0.2
      dynamic_chunk_training: false
      short_chunk_threshold: 0.75
      short_chunk_size: 25
      num_left_chunks: 4
    input_conf:
      vgg_like: true
    body_conf:
    - block_type: conformer
      linear_size: 2048
      hidden_size: 512
      heads: 8
      dropout_rate: 0.1
      pos_wise_dropout_rate: 0.1
      att_dropout_rate: 0.1
      conv_mod_kernel_size: 31
      num_blocks: 12

decoder: rnn
decoder_conf:
    rnn_type: lstm
    num_layers: 1
    embed_size: 512
    hidden_size: 512
    dropout_rate: 0.1
    embed_dropout_rate: 0.2

joint_net_conf:
    joint_space_size: 512

optim: adam
optim_conf:
    lr: 0.001
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 15000

val_scheduler_criterion:
    - valid
    - loss
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 10

specaug: null
