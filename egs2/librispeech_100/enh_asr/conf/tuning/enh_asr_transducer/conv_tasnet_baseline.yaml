# Enhancement + ASR Transducer training configuration with ESPnet Integration

# Training configuration
max_epoch: 50
log_interval: 100

# Data configuration
batch_type: numel
batch_bins: 1800000
accum_grad: 16
grad_clip: 5.0
log_interval: 100

# Model configuration using OT-guided ConvTasNet and Transducer
model_conf:
  # Loss weights
  enh_weight: 0.3
  transducer_weight: 1.0
  ot_weight: 0.1
  
  # Training configuration
  freeze_asr: False
  auxiliary_ctc_weight: 0.0
  report_cer: True
  report_wer: True
  
  # OT-guided ConvTasNet configuration
  use_ot_convtasnet: True
  convtasnet_num_filters: 512
  convtasnet_filter_length: 16
  convtasnet_bottleneck_channels: 128
  convtasnet_hidden_channels: 512
  convtasnet_kernel_size: 3
  convtasnet_num_blocks: 8
  convtasnet_num_repeats: 4
  
  # Optimal Transport parameters
  ot_hidden_dim: 256
  ot_num_iterations: 10
  ot_epsilon: 0.1

# Enhancement configuration using ESPnet's ConvTasNet
enh_encoder: same  # Use raw waveform directly
enh_encoder_conf: {}

enh_separator: conv_tasnet_baseline
enh_separator_conf:
  # ConvTasNet parameters
  num_filters: 512  # Number of filters in autoencoder
  filter_length: 16  # Length of the filters in autoencoder
  bottleneck_channels: 128  # Number of channels in bottleneck and residual paths
  hidden_channels: 512  # Number of channels in convolutional layers
  kernel_size: 3  # Kernel size in convolutions
  num_blocks_per_repeat: 8  # Number of convolutional blocks in each repeat
  num_repeats: 4  # Number of repeats
  num_speakers: 1  # Number of speakers (single speaker enhancement)

enh_decoder: same  # Use raw waveform directly
enh_decoder_conf: {}

# Enhancement criterion configuration
enh_criterion: si_snr
enh_criterion_conf: {}

# Frontend configuration for feature extraction
frontend: default
frontend_conf:
  n_mels: 80
  n_fft: 512
  hop_length: 160
  win_length: 400
  fmin: 0
  fmax: null

# Normalization
normalize: global_mvn
normalize_conf:
  stats_file: null

encoder_conf:
  main_conf:
    pos_wise_act_type: swish
    conv_mod_act_type: swish
    pos_enc_dropout_rate: 0.2
    dynamic_chunk_training: True
    short_chunk_threshold: 0.75
    short_chunk_size: 25
    num_left_chunks: 4
  input_conf:
    vgg_like: True
  body_conf:
  - block_type: conformer
    linear_size: 2048
    hidden_size: 512
    heads: 8
    dropout_rate: 0.1
    pos_wise_dropout_rate: 0.1
    att_dropout_rate: 0.1
    conv_mod_kernel_size: 31
    num_blocks: 12

decoder: rnn
decoder_conf:
  rnn_type: lstm
  num_layers: 1
  embed_size: 512
  hidden_size: 512
  dropout_rate: 0.1
  embed_dropout_rate: 0.2

joint_network_conf:
  joint_space_size: 512

# Training configuration
optim: adam
optim_conf:
  lr: 0.001
  weight_decay: 0.000001

scheduler: warmuplr
scheduler_conf:
  warmup_steps: 15000

val_scheduler_criterion:
  - valid
  - loss

best_model_criterion:
  -   - valid
      - loss
      - min

keep_nbest_models: 10

# Token configuration
token_type: bpe
token_list: data/token_list/bpe_unigram1000/tokens.txt
bpemodel: data/token_list/bpe_unigram1000/bpe.model
 