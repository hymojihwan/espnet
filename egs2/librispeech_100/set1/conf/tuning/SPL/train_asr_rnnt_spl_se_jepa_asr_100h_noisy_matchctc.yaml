# RNNT + frozen SE + JEPA baseline (matched schedule with rnnt_spl_se_asr)
batch_type: numel
batch_bins: 6000000
accum_grad: 24
max_epoch: 200
patience: none
init: none
num_att_plot: 0
log_interval: null
unused_parameters: false

model: se_jepa
model_conf:
    transducer_weight: 1.0
    auxiliary_ctc_weight: 0.0
    report_cer: true
    report_wer: true
    use_k2_pruned_loss: false
    se_hidden_size: 384
    se_dropout_rate: 0.1
    jepa_loss_weight: 0.2
    jepa_mask_prob: 0.3
    jepa_mask_span: 4
    jepa_hidden_size: 256
    jepa_predictor_hidden_size: 512
    clean_feature_loss_weight: 0.2
    clean_feature_cos_weight: 0.25
    clean_train_scp: data/train_clean_100/wav.scp
    clean_valid_scp: data/dev_clean/wav.scp

frontend: frozen_enh
frontend_conf:
    enh_train_config: exp/enh_train_enh_convtasnet_small_librispeech_raw/config.yaml
    enh_model_file: exp/enh_train_enh_convtasnet_small_librispeech_raw/valid.loss.best.pth
    fs: 16k
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80
    enh_no_grad: true

encoder_conf:
    main_conf:
      pos_wise_act_type: swish
      conv_mod_act_type: swish
      pos_enc_dropout_rate: 0.1
      dynamic_chunk_training: false
      short_chunk_threshold: 0.75
      short_chunk_size: 25
      num_left_chunks: 4
    input_conf:
      vgg_like: true
    body_conf:
    - block_type: conformer
      linear_size: 1024
      hidden_size: 256
      heads: 4
      dropout_rate: 0.1
      pos_wise_dropout_rate: 0.1
      att_dropout_rate: 0.1
      conv_mod_kernel_size: 31
      num_blocks: 12

decoder: rnn
decoder_conf:
    rnn_type: lstm
    num_layers: 1
    embed_size: 256
    hidden_size: 256
    dropout_rate: 0.1
    embed_dropout_rate: 0.1

joint_network_conf:
    joint_space_size: 256

optim: adam
optim_conf:
    lr: 0.0002
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 5000

specaug: null
use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false

val_scheduler_criterion:
    - valid
    - loss
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 10
