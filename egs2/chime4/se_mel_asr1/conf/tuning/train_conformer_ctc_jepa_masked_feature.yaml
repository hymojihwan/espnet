# CHiME4 mel80enh + clean-mel JEPA frontend + Conformer CTC
batch_type: numel
batch_bins: 12000000
accum_grad: 16
max_epoch: 200
patience: 20
early_stopping_criterion: [valid, cer_ctc, min]
init: none
best_model_criterion:
-   - valid
    - cer_ctc
    - min
keep_nbest_models: 10

frontend: jepa_masked_feature
frontend_conf:
    input_dim: 80
    output_dim: 80
    embedding_dim: 256
    context_encoder_dim: 256
    target_encoder_dim: 256
    predictor_dim: 256
    decoder_dim: 256
    num_context_encoder_layers: 2
    num_target_encoder_layers: 2
    num_predictor_layers: 2
    num_decoder_layers: 2
    patch_size: [4, 4]
    mask_ratio: 0.3
    embedding_loss_weight: 1.0
    ema_decay: 0.999
    dropout_rate: 0.1

encoder: conformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31

model: jepa_espnet
model_conf:
    ctc_weight: 1.0
    lsm_weight: 0.0
    length_normalized_loss: true
    ctc_weight_start: 0.2
    ctc_weight_end: 1.0
    ctc_weight_warmup_steps: 3000

decoder: null
decoder_conf: {}

optim: adam
optim_conf:
    lr: 0.0005
    weight_decay: 0.0001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 3000

num_att_plot: 0
specaug: null
