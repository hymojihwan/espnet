# JEPA ViT-style Masked-Patch Frontend for CTC ASR (from scratch, no SpecAugment)
# This configuration uses JEPA-style masked-patch frontend without reconstruction
# Architecture: Masking → Context encoder (visible) → Predictor → Target encoder (clean, EMA)
# Loss: Representation matching (MSE between predicted and target representations)
# SpecAugment is disabled as JEPA frontend already provides noise robustness through masking/denoising

# general
batch_type: numel
batch_bins: 24000000  # Increased to accommodate larger patch_size [16, 16] (fewer patches = more batch capacity)
accum_grad: 16  # Reduced since batch_bins is increased
max_epoch: 200
patience: none
init: none  # No pretrained model initialization
best_model_criterion:
-   - valid
    - wer_ctc
    - min
keep_nbest_models: 10
frontend: jepa_vit
frontend_conf:
    # Patch configuration
    patch_size: [16, 16]  # Larger patches for better efficiency and larger batch capacity
    mask_ratio: 0.3  # Mask 30% of patches
    
    # ViT Encoder configuration
    embed_dim: 512
    enc_depth: 4  # Number of ViT encoder layers
    enc_heads: 8  # Number of attention heads
    enc_mlp_ratio: 4.0  # MLP ratio (hidden_dim = embed_dim * mlp_ratio)
    enc_drop: 0.1  # Dropout rate
    enc_attn_drop: 0.1  # Attention dropout rate
    
    # Predictor configuration
    pred_depth: 2  # Number of ViT predictor layers
    pred_heads: 8  # Number of attention heads
    pred_mlp_ratio: 4.0  # MLP ratio
    pred_drop: 0.1  # Dropout rate
    pred_attn_drop: 0.1  # Attention dropout rate
    
    # Loss and training
    embedding_loss_weight: 1.0  # Representation matching loss weight
    ema_decay: 0.999  # EMA decay rate for target encoder
    
    # Audio processing (same as baseline)
    n_fft: 512
    hop_length: 128
    win_length: 512
    fs: 16000
    n_mels: 80
    output_dim: 80  # Output dimension (log-mel)

# Pre-encoder: Not needed - JEPA ViT frontend outputs 80-dim log-mel directly
preencoder: null
preencoder_conf: {}

# Encoder: Conformer (trained from scratch, same as standard CTC)
encoder: conformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 18
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31

# CTC model configuration (standard CTC, no progressive schedule needed)
model_conf:
    ctc_weight: 1.0
    lsm_weight: 0.1
    length_normalized_loss: false
    report_cer: True
    report_wer: True

# Decoder: None (CTC-only mode)
decoder: null
decoder_conf: {}

# optimizer (same as standard CTC training)
optim: adam
optim_conf:
    lr: 0.002  # Standard learning rate (same as train_conformer_ctc.yaml)
    weight_decay: 0.0001  # Increased from 1e-6 to 1e-4 for better regularization and faster convergence
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 15000  # Standard warmup steps (same as train_conformer_ctc.yaml)

num_att_plot: 0

# SpecAugment: Disabled for JEPA training
# JEPA ViT frontend already provides noise robustness through masking/denoising,
# so SpecAugment is not needed (similar to how SE replaces SpecAugment)
specaug: null
specaug_conf: {}

# Normalization: Use global MVN (same as standard CTC training)
normalize: global_mvn
normalize_conf:
    stats_file: exp/asr_stats_raw_en_bpe2048/train/feats_stats.npz

