optim: adam
init: xavier_uniform
max_epoch: 40
batch_type: folded
batch_size: 32
iterator_type: chunk
chunk_length: 16000
chunk_excluded_key_prefixes:
  - token_int
chunk_discard_short_samples: false
num_workers: 8
optim_conf:
    lr: 1.0e-03
    eps: 1.0e-08
    weight_decay: 1.0e-05
patience: 4
val_scheduler_criterion:
- valid
- loss
best_model_criterion:
-   - valid
    - si_snr
    - max
-   - valid
    - loss
    - min
keep_nbest_models: 1
scheduler: reducelronplateau
scheduler_conf:
    mode: min
    factor: 0.5
    patience: 3
model_conf:
    loss_type: si_snr
encoder: conv
encoder_conf:
    channel: 384
    kernel_size: 40
    stride: 20
decoder: conv
decoder_conf:
    channel: 384
    kernel_size: 40
    stride: 20
separator: tcn
separator_conf:
    num_spk: 1
    layer: 6
    stack: 3
    bottleneck_dim: 384
    hidden_dim: 768
    kernel: 3
    causal: False
    norm_type: "gLN"
    nonlinear: relu
criterions:
  - name: si_snr
    conf:
      eps: 1.0e-07
    wrapper: fixed_order
    wrapper_conf:
      weight: 1.0
