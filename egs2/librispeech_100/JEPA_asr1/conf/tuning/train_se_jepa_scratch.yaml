# SE-JEPA ASR: Conv-TasNet (SI-SNR) + JEPA predictive + Conformer CTC
# Flow: Noisy wav → SE(Conv-TasNet) → enhanced wav → log-mel → JEPA predictive → Conformer → CTC
# Loss = se_loss_weight * SI-SNR + jepa_weight * JEPA + ctc_weight * CTC

# general
batch_type: numel
batch_bins: 2500000  # Increased with AMP (mixed precision saves ~50% memory)
accum_grad: 64  # Reduced since batch_bins increased
max_epoch: 200
patience: none
init: none
best_model_criterion:
-   - valid
    - wer_ctc
    - min
keep_nbest_models: 10

# SE-JEPA Frontend: Conv-TasNet (SI-SNR) + JEPA predictive
frontend: se_jepa
frontend_conf:
    # JEPA inner frontend (enhanced log-mel vs clean log-mel)
    jepa_frontend_conf:
        embedding_dim: 256
        patch_size: [16, 16]
        mask_ratio: 0.3
        dropout_rate: 0.1
        encoder_type: transformer
        encoder_conf:
            num_layers: 2
            num_heads: 8
            ff_dim: 256  # Reduced from 512 for memory efficiency
            dropout_rate: 0.1
            attn_dropout_rate: 0.1
            use_positional_encoding: true
        predictor_type: transformer
        predictor_conf:
            num_layers: 1
            num_heads: 8
            ff_dim: 256
            dropout_rate: 0.1
            attn_dropout_rate: 0.1
            use_positional_encoding: true
        decoder_type: mlp
        decoder_conf:
            num_layers: 1
            hidden_dim: 256
            dropout_rate: 0.1
        n_fft: 512
        hop_length: 128
        win_length: 512
        fs: 16000
        n_mels: 80
        embedding_loss_weight: 1.0
        ema_decay: 0.999

    # Conv-TasNet SE (Asteroid) - Further reduced for memory efficiency
    use_asteroid_convtasnet: true
    convtasnet_n_src: 1
    convtasnet_n_filters: 128  # Further reduced from 256
    convtasnet_kernel_size: 16
    convtasnet_stride: 8
    convtasnet_n_blocks: 4  # Further reduced from 6
    convtasnet_n_repeats: 2  # Keep at 2 (minimum for reasonable performance)
    convtasnet_bn_chan: 32  # Further reduced from 64
    convtasnet_hid_chan: 128  # Further reduced from 256
    convtasnet_skip_chan: 32  # Further reduced from 64
    convtasnet_conv_kernel_size: 3

# Pre-encoder: Not needed
preencoder: null
preencoder_conf: {}

# Encoder: Conformer - Reduced for memory efficiency
encoder: conformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 18
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31

# Model: SE-JEPA ESPnet (SE loss + JEPA loss + CTC)
model: se_jepa_espnet
model_conf:
    ctc_weight: 1.0
    lsm_weight: 0.1
    length_normalized_loss: false
    report_cer: true
    report_wer: true
    se_loss_weight: 0.5       # Weight for SI-SNR loss (enhanced vs clean waveform)
    encoder_distill_weight: 0.05  # Reduced from 0.1 to prevent gradient instability
    # CTC weight schedule: start higher so encoder gets CTC gradient earlier (CER can improve)
    ctc_weight_start: 0.2     # was 0.01: too small → JEPA/SE dominate, CER stays flat
    ctc_weight_end: 1.0
    ctc_weight_warmup_steps: 5000  # was 10000: shorter warmup so CTC matters sooner

# Decoder: None (CTC-only)
decoder: null
decoder_conf: {}

# Optimizer
optim: adam
optim_conf:
    lr: 0.003
    weight_decay: 0.0001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 10000

num_att_plot: 0

# SpecAugment: Disabled
specaug: null
specaug_conf: {}

# Normalization
normalize: global_mvn
normalize_conf:
    stats_file: exp/asr_stats_raw_en_bpe2048/train/feats_stats.npz
